name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Core and policy checks
        run: Scripts/check.sh

      - name: Password form checks
        run: |
          node Tests/password_capture_checks.js
          node Tests/password_autofill_checks.js

      - name: Simulator build
        run: |
          xcodebuild -project LANBrowser.xcodeproj -scheme LANBrowser \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build

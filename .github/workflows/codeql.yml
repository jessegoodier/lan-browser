name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # uploads CodeQL results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
            runner: xcode-27
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build for CodeQL
        if: matrix.build-mode == 'manual'
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          xcodebuild -project LANBrowser.xcodeproj -scheme LANBrowser \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

version: 2
updates:
  # The app has no package dependencies; this keeps the SHA-pinned actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release so a compromised version is likely caught first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
